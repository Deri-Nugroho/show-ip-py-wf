name: Build & Push to ECR for Docker Swarm

on:
  push:
    branches: 
      - swarm

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG=latest
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build -t $IMAGE -f ./Dockerfile .
          docker push $IMAGE

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Install Docker & Deploy to Swarm on Amazon Linux 2023
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo bash -c '
              if ! command -v docker &> /dev/null; then
                yum update -y
                yum install -y docker
                systemctl enable docker
                systemctl start docker
              fi

              if ! docker info | grep -i "Swarm: active"; then
                docker swarm init || true
              fi

              IMAGE=${{ env.IMAGE }}
              docker pull $IMAGE
              docker service update --image $IMAGE my-swarm-service || \
              docker service create --name my-swarm-service --publish 80:5000 $IMAGE
              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
                docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

              docker service update --image $IMAGE my-swarm-service || \
              docker service create --name my-swarm-service --publish 80:5000
            '