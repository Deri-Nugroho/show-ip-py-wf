name: Build & Push to ECR for Docker Swarm

on:
  push:
    branches: 
      - swarm

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v3

      # 2. Setup Docker Buildx (untuk build image multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Konfigurasi kredensial AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 4. Login ke Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build dan push Docker image ke ECR
      - name: Build and push Docker image to ECR
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG=latest
          IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build -t $IMAGE -f ./Dockerfile .
          docker push $IMAGE

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # 6. SSH ke EC2 dan deploy menggunakan Docker Swarm
      - name: Install Docker & Deploy to Swarm on Amazon Linux 2023
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,IMAGE
          script: |
            echo "IMAGE: $IMAGE"

            sudo bash -c "
              set -e

              if ! command -v docker &> /dev/null; then
                yum update -y
                yum install -y docker unzip curl
                systemctl enable docker
                systemctl start docker
                usermod -aG docker ec2-user
              fi

              if ! docker info | grep -i 'Swarm: active'; then
                docker swarm init || true
              fi

              # Install AWS CLI if not available
              if ! command -v aws &> /dev/null; then
                curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip'
                unzip awscliv2.zip
                sudo ./aws/install
              fi

              # Export AWS credentials
              export AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID'
              export AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY'
              export AWS_SESSION_TOKEN='$AWS_SESSION_TOKEN'
              export AWS_REGION='$AWS_REGION'

              echo 'Logging in to ECR...'
              registry=\$(echo $IMAGE | cut -d'/' -f1)
              aws ecr get-login-password --region \$AWS_REGION | docker login --username AWS --password-stdin \$registry

              echo 'Pulling image...'
              docker pull $IMAGE

              echo 'Updating or creating service...'
              docker service ls | grep my-swarm-service && \
                docker service update --image $IMAGE my-swarm-service || \
                docker service create --name my-swarm-service --publish 80:5000 $IMAGE
            "