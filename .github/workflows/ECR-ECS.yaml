name: Build & Deploy to ECS Fargate

on:
  push:
    branches:
      - ecs

env:
  IMAGE_TAG: latest
  IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to ECR
      run: |
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI

    - name: Render task definition
      run: |
        sed -i "s|<IMAGE_URI>|$IMAGE_URI|g" ecs/task-def.json
        sed -i "s|<AWS_REGION>|${{ secrets.AWS_REGION }}|g" ecs/task-def.json
        sed -i "s|<ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" ecs/task-def.json
        sed -i "s|<TASK_EXECUTION_ROLE>|${{ secrets.ECS_TASK_EXECUTION_ROLE }}|g" ecs/task-def.json
        sed -i "s|<TASK_ROLE>|${{ secrets.ECS_TASK_ROLE }}|g" ecs/task-def.json

    - name: Register new ECS task definition
      id: register-task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ecs/task-def.json

    - name: Deploy to ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.register-task.outputs.task-definition }}
        service: ${{ secrets.ECS_SERVICE }}
        cluster: ${{ secrets.ECS_CLUSTER }}
        wait-for-service-stability: true
